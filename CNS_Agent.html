<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNS AI Agent Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            color: #005073;
        }

        .notice {
            background: #f5f5f5;
            border-left: 4px solid #005073;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>CNS AI Agent Test Page</h1>

    <p>
        Welcome to the CNS AI Agent proof-of-concept site.
    </p>

    <div class="notice">
        Click the chat icon in the lower-right corner to start a conversation with the AI Agent.
    </div>

    <!-- Webex AI Agent -->
    <div
        id="divicw"
        data-bind="85A39907-3F9E-46BA-AF02-E158D718464E"
        data-org=""
        data-guid="5ac729bf-a97e-487b-9439-ff7bf205991f">
    </div>

    <script>
    (function () {
        try {
            var e = document.getElementById("divicw");
            var t = document.createElement("script");

            t.src =
                "https://chat-widget.prodca1.ciscoccservice.com/js/imichatinit.js?t=" +
                new Date().toISOString();

            e.insertAdjacentElement("afterend", t);

            t.addEventListener("load", function () {
                console.log(
                    new Date().toISOString(),
                    "Livechat script loaded successfully!"
                );
            });

            t.addEventListener("error", function () {
                console.log(
                    new Date().toISOString(),
                    "Error loading Livechat script"
                );
            });
        } catch (err) {
            console.error(err);
        }
    })();
    </script>

</body>
</html>
