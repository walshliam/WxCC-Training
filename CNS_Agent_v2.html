<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CNS AI Agent</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* Cisco widget placeholder */
#divicw {
    width: 100%;
    height: 100%;
}

/* Hide launcher button */
#imi-chatbutton {
    display: none !important;
}

/* Force chat window fullscreen */
#chatwindow {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    max-width: none !important;
    max-height: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    z-index: 999999 !important;
}

/* Resize chat area */
#chat {
    height: calc(100vh - 240px) !important;
}

#icwdivcarea {
    height: 100% !important;
}
</style>

</head>
<body>

<div id="divicw"
     data-bind="85A39907-3F9E-46BA-AF02-E158D718464E"
     data-org=""
     data-guid="5ac729bf-a97e-487b-9439-ff7bf205991f">
</div>

<script>
(function() {

    var widgetScript = document.createElement("script");

    widgetScript.src =
        "https://chat-widget.prodca1.ciscoccservice.com/js/imichatinit.js?t=" +
        new Date().toISOString();

    widgetScript.onload = function() {

        console.log("Cisco chat loaded");

        const watcher = setInterval(function() {

            const launcher =
                document.getElementById("imi-chatbutton");

            const chatWindow =
                document.getElementById("chatwindow");

            if (launcher && !chatWindow) {
                launcher.click();
            }

            if (chatWindow) {

                console.log("Chat window found");

                chatWindow.style.position = "fixed";
                chatWindow.style.top = "0";
                chatWindow.style.left = "0";
                chatWindow.style.width = "100vw";
                chatWindow.style.height = "100vh";
                chatWindow.style.maxWidth = "none";
                chatWindow.style.maxHeight = "none";

                clearInterval(watcher);
            }

        }, 1000);
    };

    document.body.appendChild(widgetScript);

})();
</script>

</body>
</html>
