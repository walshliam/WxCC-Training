<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNS AI Agent</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#status {
    padding: 20px;
    font-family: Arial, sans-serif;
}
</style>
</head>
<body>

<div id="status">
    Loading CNS AI Agent...
</div>

<div id="divicw"
     data-bind="85A39907-3F9E-46BA-AF02-E158D718464E"
     data-org=""
     data-guid="5ac729bf-a97e-487b-9439-ff7bf205991f">
</div>

<script>
(function () {

    var e = document.getElementById("divicw");
    var t = document.createElement("script");

    t.src =
        "https://chat-widget.prodca1.ciscoccservice.com/js/imichatinit.js?t=" +
        new Date().toISOString();

    e.insertAdjacentElement("afterend", t);

    t.onload = function () {
        console.log("Cisco widget loaded");
        document.getElementById("status").innerHTML =
            "Cisco widget loaded successfully";
    };

    t.onerror = function () {
        console.log("Cisco widget failed");
        document.getElementById("status").innerHTML =
            "Cisco widget failed to load";
    };

})();
</script>
<style>
#imi-chatbutton {
    opacity: 0 !important;
}

#chatwindow {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    max-width: none !important;
    max-height: none !important;
    z-index: 999999 !important;
}
</style>

<script>
window.addEventListener("load", function () {

    setTimeout(function () {

        var launcher = document.getElementById("imi-chatbutton");

        if (launcher) {
            console.log("Clicking launcher");
            launcher.click();
        }

    }, 3000);

});
</script>
</body>
</html>
